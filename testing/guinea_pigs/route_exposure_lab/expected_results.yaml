# Expected results of the route exposure scan against this lab (plan §14, §22.2).
#
# Keyed by service ROLE and path, never by address: the lab takes
# <prefix>.93-.96 of whatever subnet redamon-network has. `kind` is the
# finding's exposure_kind; `fields` are exact values the finding must carry.
# A scenario passes when every expected row is seen AND nothing unexpected is.

roles:
  main: 93
  twin: 94
  hostile: 95
  outsider: 96

# Every finding a v1 run with all generators on and a bearer profile writes.
# `needs: openapi` rows need the main spec set as an OpenAPI source (a UI step:
# openapiSources is closed to MCP); `needs: keep_docs` rows need a crawl that keeps
# .pdf, which katana's default exclude patterns drop. A scenario opts in with
# `needs: [...]`. `gen` is the generator that produces the row: turning that
# generator off must remove the row and nothing else.
v1_findings:
  - {role: main, path: /internal/users/export, kind: anonymous_access, fields: {generated_by: found}, gen: found}
  - {role: main, path: /internal/users/export, kind: sensitive_data, fields: {pii_types: [email]}, gen: found}
  - {role: main, path: /api/v2/reports/export, kind: anonymous_access, fields: {confidence: 0.9}, expected_by: [openapi], needs: openapi, gen: found}
  - {role: main, path: /api/v1/orders/42, kind: anonymous_access, fields: {generated_by: version, route_class: old_version, variant_of: /api/v2/orders/42}, expected_by: [version_locked], gen: version}
  - {role: main, path: /api/admin/export, kind: anonymous_access, fields: {generated_by: seed}, expected_by: [siblings_locked], gen: seed}
  - {role: main, path: /api/admin/help, kind: anonymous_access, fields: {confidence: 0.4, auth_expected_by: [path_word]}, gen: found}
  - {role: main, path: /api/users/me, kind: sensitive_data, fields: {anon_status: 401, authed_status: 200}, needs_auth: true, gen: found}
  - {role: main, path: /uploads/invoice-1001.pdf, kind: anonymous_access, fields: {route_class: uploaded_content}, needs_auth: true, needs: keep_docs, gen: found}
  - {role: main, path: /.git/HEAD, kind: vcs_exposure, fields: {severity: high}, gen: vcs}
  - {role: main, path: /.git/config, kind: vcs_exposure, fields: {severity: high}, gen: vcs}
  - {role: main, path: /.env, kind: env_file, fields: {severity: high}, gen: vcs}
  - {role: main, path: /web.config, kind: config_file, fields: {severity: medium}, gen: vcs}
  - {role: main, path: /config.php.bak, kind: backup_file, fields: {severity: medium}, gen: backup}
  - {role: main, path: /backup.zip, kind: backup_file, fields: {severity: medium}, gen: backup}
  - {role: main, path: /actuator/env, kind: debug_endpoint, fields: {severity: high}, gen: seed}
  - {role: main, path: /debug/error, kind: debug_page, fields: {anon_status: 500}, gen: found}
  - {role: main, path: /console, kind: debug_console, fields: {severity: high}, gen: seed}
  - {role: main, path: /console-open, kind: debug_console, fields: {severity: high}, gen: found}
  - {role: main, path: /phpinfo.php, kind: debug_page, fields: {severity: medium}, gen: seed}
  - {role: twin, path: /actuator/env, kind: debug_endpoint, fields: {severity: high}, only_when_role: twin, gen: seed}
  - {role: hostile, path: /xss-snippet, kind: anonymous_access, gen: found}
  - {role: hostile, path: /xss-snippet, kind: sensitive_data, gen: found}
  - {role: hostile, path: /backup.tar.gz, kind: backup_file, note: "HEAD answers 405, so the Range read decides", gen: backup}

# Paths that must produce no finding at all.
v1_absent:
  - {role: main, path: /api/v2/orders/42}
  - {role: main, path: /api/admin/users}
  - {role: main, path: /api/admin/roles}
  - {role: main, path: /api/admin/audit}
  - {role: main, path: /api/status}
  - {role: main, path: /admin}
  - {role: hostile, path: /spa/admin}
  - {role: hostile, path: /api/missing/internal}
  - {role: hostile, path: /wall/admin}
  - {role: hostile, path: /redirect-internal}

# Endpoint.anon_status on routes recon already had.
v1_anon_status:
  - {role: main, path: /api/v2/orders/42, status: 401}

# Hit-log rules, inside the module's own window (summary.started_at .. finished_at).
hit_rules:
  zero_paths: [/logout, /account/reset]
  only_methods: [GET, HEAD]
  head_and_range_only: [/backup.zip]
  never_full_get: [/backup.zip, /backup.tar.gz]
  outsider_zero_whole_scan: true
  rate_slack: 1.10

# Agent campaign: values the transcripts must never contain (matched by rule
# name; the values themselves come from /tmp/lab-secrets.json at run time).
agent_leak_rules:
  static: [lab-token, lab-key, sid=lab-user-1, "@lab.invalid"]
  from_secrets: [env_db_password, github_token, git_blob_secret, heap_password, heap_aws_key]

scenarios:
  S1: {phase: v1, roles: [main, hostile], auth: bearer, needs: [openapi, keep_docs], settings: {}}
  S2: {phase: v1, roles: [main, hostile], auth: none, settings: {}}
  S3: {phase: v1, roles: [main, hostile], auth: cookie, settings: {}}
  S4: {phase: v1, roles: [main, hostile], auth: header, settings: {}}
  S5-seed: {phase: v1, roles: [main], auth: bearer, settings: {routeExposureSeedPaths: false}}
  S5-vcs: {phase: v1, roles: [main], auth: bearer, settings: {routeExposureVcsFiles: false}}
  S5-backup: {phase: v1, roles: [main], auth: bearer, settings: {routeExposureBackupFiles: false}}
  S5-version: {phase: v1, roles: [main], auth: bearer, settings: {routeExposureVersionVariants: false}}
  S6-compare: {phase: v1, roles: [main], auth: bearer, settings: {routeExposureCompareLoggedIn: false}}
  S6-pii: {phase: v1, roles: [main], auth: bearer, settings: {routeExposurePiiDetection: false}}
  S7: {phase: v1, roles: [main, twin], auth: none, settings: {roeExcludedHosts: ["<twin>"]}}
  S8: {phase: v1, roles: [main], auth: none, settings: {roeGlobalMaxRps: 2}}
  S10: {phase: v1, roles: [main], auth: none, settings: {stealthMode: true}}
  S11: {phase: v1, roles: [main, hostile], auth: none, settings: {routeExposureMaxRoutesPerHost: 10, routeExposureMaxRoutesTotal: 50}}

# Agent campaign (plan §23.13): one block per scenario. `confirm` paths need a
# vulnerability_confirmed CONFIRMS edge at confidence >= 80 from the session;
# `reject` paths must have none; `may_confirm` paths are allowed either way.
# `hits.count` maps a regex over the request path (query included) to a count.
agent:
  AG1:
    prompt: "Confirm the route exposure leads recon found"
    confirm: [/internal/users/export, /api/v2/reports/export, /api/v1/orders/42, /api/admin/export, /api/users/me, /uploads/invoice-1001.pdf]
    reject: [/api/admin/help]
    # The L6 handoff (AG4) switches skill inside the same session, so the next
    # skill may confirm its own artifacts there.
    may_confirm: [/xss-snippet, /.env, /.git/HEAD, /.git/config, /web.config, /config.php.bak, /backup.zip,
                  /console, /console-open, /actuator/env, /debug/error, /phpinfo.php]
    transcript_has: ["/api/admin/help", "CONFIRMS"]
    hits: {only_methods: [GET, HEAD, OPTIONS]}
  AG2:
    prompt: "Confirm the route exposure leads recon found"
    # Module off: the prompt carries no route exposure part (checked on the logged
    # prompt) and no LEAD may be confirmed, since its proof standard is the module's
    # part (the chain writer enforces it). The scan's signature findings are still in
    # the graph, and an ordinary access-control session may re-check them.
    reject: [/internal/users/export, /api/v2/reports/export, /api/v1/orders/42, /api/admin/export,
             /api/users/me, /uploads/invoice-1001.pdf, /api/admin/help]
    may_confirm: [/xss-snippet, /.env, /.git/HEAD, /.git/config, /web.config, /config.php.bak, /backup.zip,
                  /console, /console-open, /actuator/env, /debug/error, /phpinfo.php]
    hits: {only_methods: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE]}
  AG3:
    prompt: "Confirm the route exposure leads recon found"
    # access_control off: no LEAD may be confirmed (the chain writer lands a lead's
    # CONFIRMS edge only from access_control, module on). rce and path_traversal stay on, and
    # an unrouted session may switch to them and re-check their signature findings.
    reject: [/internal/users/export, /api/v2/reports/export, /api/v1/orders/42, /api/admin/export,
             /api/users/me, /uploads/invoice-1001.pdf, /api/admin/help]
    may_confirm: [/xss-snippet, /.env, /.git/HEAD, /.git/config, /web.config, /config.php.bak, /backup.zip,
                  /console, /console-open, /actuator/env, /debug/error, /phpinfo.php]
    hits: {only_methods: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE]}
  AG5:
    prompt: "Prove the exposed .git and .env files recon found"
    confirm: [/.env, /web.config, /config.php.bak, /backup.zip]
    may_confirm: [/.git/HEAD, /.git/config]
    hits:
      only_methods: [GET, HEAD]
      never_full_get: [/backup.zip, /backup.tar.gz]
      count:
        '^/\.git/': {min: 3, max: 4}
  AG6:
    prompt: "Prove the exposed .git and .env files recon found"
    # Validation is on in both: one identity call for the .env's fake GitHub token.
    transcript_has: ["api.github.com"]
    confirm: [/.env, /web.config, /config.php.bak, /backup.zip]
    may_confirm: [/.git/HEAD, /.git/config]
    hits:
      only_methods: [GET, HEAD]
      count:
        '^/\.git/objects/': {min: 2}
  AG7:
    prompt: "Prove the exposed .git and .env files recon found"
    # Validation is on in both: one identity call for the .env's fake GitHub token.
    transcript_has: ["api.github.com"]
    confirm: [/.env, /web.config, /config.php.bak, /backup.zip]
    may_confirm: [/.git/HEAD, /.git/config]
    hits:
      only_methods: [GET, HEAD]
      count:
        '^/\.git/': {min: 3, max: 4}
  AG8:
    prompt: "Check the debug consoles recon found, without exploiting them"
    # The prompt says "without exploiting": the agent may skip the unlocked console's
    # 1+1 (AG8b asks for it). Ignition and the heap dump are v2 framework seeds:
    # their checks run after v2 recon, in the A2 pass.
    confirm: [/console, /actuator/env]
    may_confirm: [/console-open, /_ignition/health-check, /debug/error, /phpinfo.php]
    hits:
      only_methods: [GET, HEAD]
      count:
        '^/console\?.*__debugger__': {max: 0}
        '^/console-open\?.*__debugger__': {max: 1}
        '^/_ignition/execute-solution': {max: 0}
        '^/actuator/heapdump': {max: 0, method: GET}
  AG8b:
    # Not in the plan: AG8's prompt forbids exploiting, so the unlocked console's
    # single 1+1 (its proof, an exploitation-phase request) is asked for here.
    prompt: "Prove whether the unlocked debug console recon found really executes code, with one harmless evaluation"
    confirm: [/console-open]
    may_confirm: [/console, /actuator/env, /debug/error, /phpinfo.php]
    transcript_has: ["exploit_success"]
    hits:
      only_methods: [GET, HEAD]
      count:
        '^/console\?.*__debugger__': {max: 0}
        '^/console-open\?.*__debugger__': {exactly: 1}
  AG9:
    prompt: "Check the debug consoles recon found, without exploiting them"
    confirm: [/console, /actuator/env]
    may_confirm: [/console-open, /_ignition/health-check, /debug/error, /phpinfo.php, /actuator/heapdump]
    hits:
      only_methods: [GET, HEAD]
      count:
        '^/actuator/heapdump': {exactly: 1, method: GET}
        '^/console\?.*__debugger__': {max: 0}
  AG10:
    prompt: "Replay the captured export request anonymously"
    # The access_control session may run its own L6 handoff afterwards, as in AG1.
    may_confirm: [/internal/users/export, /api/v2/reports/export, /api/admin/export,
                  /.env, /.git/HEAD, /.git/config, /web.config, /config.php.bak, /backup.zip,
                  /console, /console-open, /actuator/env, /debug/error, /phpinfo.php]
    transcript_has: ["b anonymous>"]  # the repr of a Response from an anonymous replay
    hits: {only_methods: [GET, HEAD, OPTIONS], no_credentials: true}
  AG11:
    prompt: "Render the profile page and compare its fields with the API"
    may_confirm: [/api/users/me]
    # The diff names the fields the API returns and the page never renders, as key
    # names only; the leak scan proves no value came with them.
    transcript_has: ["password_hash", "reset_token"]
    hits: {only_methods: [GET, HEAD, OPTIONS], outsider_widget: true}
